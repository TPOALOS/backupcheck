[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backupcheck"
version = "1.0.0"
description = "Check that your backups exist, are fresh, plausible and readable: age, size drop, archive and checksum verification. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["backup", "backups", "verification", "sysadmin", "cron"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/backupcheck"

[project.scripts]
backupcheck = "backupcheck:main"

[tool.setuptools]
py-modules = ["backupcheck"]
